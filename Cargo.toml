[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "3.0.0-dev.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/xresloader/xresconv-gui"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
