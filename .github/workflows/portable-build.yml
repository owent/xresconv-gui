name: portable-build

# 跨平台 portable 构建验证（用户 2026-09-27 指示：无签名证书，各平台打包
# 仅需 Portable 包，不需要安装包；Windows 发行包为 7z、Linux 为 tar.zst。
# Linux 两种运行时策略都与 AppImage
# 并存）。范围（packaging/matrix.ts portableArtifactNames 精确 8 项，
# fail-closed）：
#   macOS x64/arm64 offline → 未签名 .app（ditto 压缩 .app.zip；无签名身份
#   环境时 tauri-bundler 跳过签名/公证，tauri-cli v2.11.5 keychain()=None）；
#   Linux x86_64/aarch64 offline → 自含 AppImage + 同内容自含 tar.zst（P5-06
#   路线，仅在 Ubuntu 22.04 最老基线构建；linuxdeploy aarch64 由 tauri-bundler
#   按目标架构选取，bundler 自带 APPIMAGE_EXTRACT_AND_RUN=1，无需 FUSE）；
#   Linux x86_64/aarch64 bootstrap → 系统 WebKitGTK tar.zst（尽量复用发行版
#   运行时，解压平铺布局，preflight.sh 探测/指引；构建基线记录在包内
#   manifest，文件名不带 distro——产物发行版无关）。
# macOS 两变体（bootstrap/offline）负载相同（targets.json 仅 variant 字段
# 不同），portable 验证取 offline 命名。不签名、不写 release：聚合 job 只做
# 产物集合 + SHA-256 边车核验（CI-06 语义，无发布权限）。

on:
  push:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: portable-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build-macos:
    name: build macos ${{ matrix.arch }} portable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # D5：x64/arm64 分别原生构建；runner 架构必须与 --arch 匹配
          #（package-cli nativeArch 会拒绝外来宿主）。
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack Yarn (pinned by packageManager)
        run: corepack enable
      - name: Install (immutable)
        run: corepack yarn install --immutable
      - name: Rust toolchain (locked by src-tauri rust-toolchain)
        run: |
          rustup show active-toolchain || rustup toolchain install
      # Swatinem/rust-cache v2.9.2（与 E2E/生产安装器缓存分离：key 含用途与架构）
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: portable-macos-${{ matrix.arch }}
      - name: Build portable .app (unsigned) and zip
        run: corepack yarn package:macos --portable --variant=offline --arch=${{ matrix.arch }}
      - name: Verify artifact (extract, manifest identity, per-file SHA-256, bundled node)
        run: node --experimental-strip-types scripts/verify-portable.ts --os=macos --arch=${{ matrix.arch }} --variant=offline
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: portable-macos-${{ matrix.arch }}
          path: |
            build/dist/xresconv-gui-*-macos-${{ matrix.arch }}-offline.app.zip
            build/dist/xresconv-gui-*-macos-${{ matrix.arch }}-offline.app.zip.sha256

  build-linux:
    name: build linux ${{ matrix.arch }} portable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 离线自含包按 05 册仅在 Ubuntu 22.04 最老基线构建（x86_64 与
          # aarch64 同基线）；GitHub ARM runner 原生 aarch64，无交叉编译。
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux AppImage build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils zstd
          test -x /usr/bin/xdg-open
      - name: Enable Corepack Yarn (pinned by packageManager)
        run: corepack enable
      - name: Install (immutable)
        run: corepack yarn install --immutable
      - name: Rust toolchain (locked by src-tauri rust-toolchain)
        run: |
          rustup show active-toolchain || rustup toolchain install
      # Swatinem/rust-cache v2.9.2（与 E2E/生产安装器缓存分离：key 含用途与架构）
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
          key: portable-linux-${{ matrix.arch }}
      - name: Build self-contained AppImage + offline tar.zst
        run: corepack yarn package:linux --portable --variant=offline --distro=ubuntu-22.04
      - name: Build system-WebKitGTK bootstrap tar.zst
        run: corepack yarn package:linux --portable --variant=bootstrap --distro=ubuntu-22.04
      - name: Verify artifacts (extract, manifest identity, per-file SHA-256, bundled node, runtime strategy)
        run: |
          node --experimental-strip-types scripts/verify-portable.ts --os=linux --arch=${{ matrix.arch }} --variant=offline
          node --experimental-strip-types scripts/verify-portable.ts --os=linux --arch=${{ matrix.arch }} --variant=bootstrap
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: portable-linux-${{ matrix.arch }}
          path: |
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-offline.AppImage
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-offline.AppImage.sha256
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-offline.tar.zst
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-offline.tar.zst.sha256
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-bootstrap.tar.zst
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-bootstrap.tar.zst.sha256

  # CI-06 语义（无 release 写权限）：portable 范围的精确产物集合 + 边车哈希。
  # 集合 = packaging/matrix.ts portableArtifactNames，缺失/多余/改名一律失败。
  verify-matrix:
    name: verify portable matrix
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack Yarn (pinned by packageManager)
        run: corepack enable
      - name: Install (immutable)
        run: corepack yarn install --immutable
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: build/release-artifacts
      - name: Verify portable artifact set and SHA-256 sidecars
        run: node --experimental-strip-types scripts/verify-portable.ts --aggregate
