name: ci

on:
  push:
    branches: [dev, master, "build/validate-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # Node 业务、契约与文档质量检查。
  quality-node:
    name: quality (node)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Yarn dependencies (immutable, cached)
        uses: ./.github/actions/setup-yarn
      - name: Lint & format
        run: corepack yarn lint
      - name: Typecheck
        run: corepack yarn typecheck
      - name: Unit & contracts
        run: |
          corepack yarn test:unit
          corepack yarn test:contracts
      - name: Browser E2E (chromium/firefox/webkit)
        run: |
          corepack yarn workspace @xresconv/desktop exec playwright install --with-deps chromium firefox webkit
          corepack yarn test:browser
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright/

  # ：Tauri 壳原生检查（fmt/clippy/test，--locked）。yarn 脚本包装
  # 需要 node_modules——先装 Node 依赖（仅安装，不跑 JS 测试）。
  quality-shell:
    name: quality (shell)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Yarn dependencies (immutable, cached)
        uses: ./.github/actions/setup-yarn
      - name: Install Linux GTK/WebKit build deps (glib-sys etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain (locked by src-tauri rust-toolchain)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
      # Swatinem/rust-cache v2.9.2（E2E 与生产构建缓存分离：key 含用途）
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: . -> target
          key: shell-quality
      - name: fmt + clippy + test (locked, deny warnings)
        run: |
          cargo fmt --all --check
          corepack yarn check:shell
          corepack yarn test:shell

  desktop-e2e:
    name: desktop e2e (${{ matrix.os }})
    needs: [quality-node, quality-shell]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-15-intel
          - os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux WebKitGTK build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: Install Yarn dependencies (immutable, cached)
        uses: ./.github/actions/setup-yarn
      - name: Cache desktop Rust dependencies and installed tools
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: . -> target
          key: desktop-e2e-${{ matrix.os }}
          cache-on-failure: true
      - name: Windows console-window regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --workspace --locked gui_shell_does_not_create_a_guardian_console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack yarn workspace @xresconv/guardian exec vitest run test/process-tree.test.ts -t 'scoped subprocesses cannot open a visible Windows console'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Locate msedgedriver (Windows)
        if: runner.os == 'Windows'
        run: |
          $runtime = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          Write-Host "WebView2 runtime: $runtime"
          $url = "https://msedgedriver.microsoft.com/$runtime/edgedriver_win64.zip"
          New-Item -ItemType Directory -Force build/tools | Out-Null
          try { Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 30 -OutFile build/tools/edgedriver.zip } catch { $url = "https://msedgedriver.azureedge.net/$runtime/edgedriver_win64.zip"; try { Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 30 -OutFile build/tools/edgedriver.zip } catch { $url = "https://registry.npmmirror.com/-/binary/edgedriver/$runtime/edgedriver_win64.zip"; Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 30 -OutFile build/tools/edgedriver.zip } }
          Expand-Archive build/tools/edgedriver.zip -DestinationPath build/tools
          & .\build\tools\msedgedriver.exe --version
          "MSEDGEDRIVER_PATH=$pwd\build\tools\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh
      - name: Desktop E2E (Windows, medium integrity)
        # 提权宿主会让 WebView2 忽略 msedgedriver 注入的调试参数（见 job 头
        # 注释）。gsudo 以 medium integrity 运行整套测试（node/tauri-driver/
        # msedgedriver/app 全链随之降权）；icacls 放开工作区让降权进程可写
        # build/target（tauri 官方 test-api-e2e 同款步骤）。
        if: runner.os == 'Windows'
        run: |
          winget install gerardog.gsudo --accept-source-agreements --accept-package-agreements
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F"
          sudo --integrity Medium corepack yarn test:desktop
        shell: pwsh
      - name: Desktop E2E (xvfb)
        if: runner.os == 'Linux'
        # Linux 无显示服务器：xvfb-run 提供虚拟 X（wdio tauri-service 需要真实窗口）。
        run: xvfb-run -a corepack yarn test:desktop
      - name: Desktop E2E (WKWebView, embedded test driver)
        if: runner.os == 'macOS'
        run: corepack yarn test:desktop
      - name: Diagnose app launch (Windows)
        # DevToolsActivePort 排查：直接运行 debug exe 8s 捕获自身输出
        #（预检/guardian 启动失败会在 stderr 现形）。非致命。
        if: runner.os == 'Windows' && failure()
        run: |
          $job = Start-Job -ScriptBlock { & .\target\debug\xresconv-gui.exe 2>&1 }
          Start-Sleep -Seconds 8
          Receive-Job $job
          Stop-Job $job; Remove-Job $job -Force
        shell: pwsh
      # actions/upload-artifact v7.0.1（失败证据：日志/截图/退出码）
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-evidence-${{ matrix.os }}
          path: |
            build/browser-test-results
            build/desktop-test-results
            build/e2e-*.log
          if-no-files-found: ignore
