name: build

# 旧 Electron 架构构建（P7 删除）：仅 main 推送触发。
# 2026-09-25 移除 pull_request 触发——dev 分支为新架构（Tauri + Node
# workspaces），旧工作流在 dev 上必然失败并阻塞 PR 检查；新架构 CI 见
# ci.yml（quality-node/quality-shell/desktop-e2e）。
on: # @see https://help.github.com/en/articles/events-that-trigger-workflows#webhook-events
  push:
    branches: # Array of patterns that match refs/heads
      - main # Push events on master branch

jobs:
  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Hydrate LFS assets
        run: git lfs pull
        shell: pwsh
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
      - name: Build
        run: |
          & git log -n 10 --pretty=oneline
          New-Item -ItemType Directory -Force ~/.npm-global
          npm config set prefix "~/.npm-global"
          if ( "${{ matrix.os }}" -eq "windows-latest" ) { 
            $ENV:PATH="~/.npm-global/bin;$ENV:PATH"
          } else {
            $ENV:PATH="~/.npm-global/bin:$ENV:PATH"
          }
          if (Test-Path "out") { Remove-Item -Recurse -Force "out" }
          & npm install -g yarn
          & yarn install --registry https://registry.npmjs.org
          & yarn run package-test --registry https://registry.npmjs.org

        shell: pwsh
      - name: Release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "out/*.7z;out/*.tar.xz"
          tags: true
          draft: true
          overwrite: true
          # verbose: true
