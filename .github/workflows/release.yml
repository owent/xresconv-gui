name: release

# 新架构发行：v3 标签创建 draft；手动构建仅上传 Actions 产物。
# Windows = 解压即用 7z 归档（bootstrap 附 Evergreen 引导器；offline
# 内嵌 Fixed Version 运行时完全离线，用支持 7z 的工具解压，
# 无安装器）；Linux = 发行版无关 tar.zst（bootstrap
# 系统 WebKitGTK + offline 自含，AppImage 与 tar.zst 并存；不再产出 deb/rpm）
# ——两者与 --portable 与否无关；macOS 保持 dmg 双变体（不签名——签名/公证
# 在受控发行环境后补，P5-07）。汇总 job 是唯一写 release 的入口，校验产物
# 名集合与 targets.json 全量 14 产物完全相等后创建
# draft（不 overwrite，不自动发布）。
# 旧 v2.x 标签不再触发（D1：旧架构 2.6.0 为终点版本）。

on:
  push:
    branches:
      - "build/validate-*"
    tags:
      - "v3*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # CI-04：按平台构建变体。产物命名/矩阵由 packaging/targets.json 派生。
  build-windows:
    name: build windows ${{ matrix.arch }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # bootstrap=系统 Evergreen+bootstrapper sidecar；offline=内嵌 Fixed
        # Version 运行时（构建期抓官方下载页直链下载 cab，~300MB，缓存于
        # build/webview2-fixedruntime）。
        variant: [bootstrap, offline]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Check 7-Zip
        shell: pwsh
        run: |
          7z i > $null
          if ($LASTEXITCODE -ne 0) { throw '7-Zip is required for Windows release archives' }
      - run: corepack yarn install --immutable
      - run: corepack yarn package:windows --variant=${{ matrix.variant }} --arch=${{ matrix.arch }}
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: artifacts-windows-${{ matrix.arch }}-${{ matrix.variant }}
          # 双变体均为 7z，归档与 SHA-256 必须同时上传。
          path: |
            build/dist/xresconv-gui-*-windows-${{ matrix.arch }}-${{ matrix.variant }}.7z
            build/dist/xresconv-gui-*-windows-${{ matrix.arch }}-${{ matrix.variant }}.7z.sha256

  build-linux:
    name: build linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最老支持基线（glibc 2.35 地板）单点构建；tar.zst/AppImage 均发行版无关
          - distro: ubuntu-22.04
            variant: all
            arch: x86_64
            runner: ubuntu-22.04
          - distro: ubuntu-22.04
            variant: all
            arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev zstd
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn package:linux --variant=${{ matrix.variant }} --distro=${{ matrix.distro }} --arch=${{ matrix.arch }}
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: artifacts-linux-${{ matrix.arch }}
          path: |
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-bootstrap.tar.zst*
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-offline.AppImage*
            build/dist/xresconv-gui-*-linux-${{ matrix.arch }}-offline.tar.zst*

  build-macos:
    name: build macos ${{ matrix.arch }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [bootstrap, offline]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: corepack yarn install --immutable
      # D5：x64/arm64 分别原生构建（runner 架构须匹配；arm64 用 macos arm64 runner）
      - run: corepack yarn package:macos --variant=${{ matrix.variant }} --arch=${{ matrix.arch }}

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: artifacts-macos-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            build/dist/xresconv-gui-*-macos-${{ matrix.arch }}-${{ matrix.variant }}.dmg*

  # 所有构建均先以只读权限验证全量产物；手动入口在这里结束。
  verify-matrix:
    name: verify full artifact matrix
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: corepack yarn install --immutable
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: build/release-artifacts
      - name: Read candidate version
        id: version
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "value=" + require("./package.json").version + "\n")'
      - name: Verify artifact set equals expected matrix
        run: node scripts/verify-release.ts
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v3') && github.ref_name || steps.version.outputs.value }}

  # 唯一具有 release 写权限的 job：手动触发永远不进入此 job。
  aggregate-release:
    name: aggregate draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v3')
    needs: [verify-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: build/release-artifacts
      - name: Create draft release (no overwrite)
        # xresloader/upload-to-github-release v1.6.2
        uses: xresloader/upload-to-github-release@v1.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "build/release-artifacts/**/*"
          tags: true
          draft: true
          # 含 prerelease 后缀的 tag（如 v3.0.0-dev.1、v3.0.0-rc.1）标记为
          # pre-release；正式版 tag（如 v3.0.0）保持 false。
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite: false
