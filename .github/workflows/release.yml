name: release

# 新架构发行（P5 CI-04/CI-06 + 2026-09-28 portable 归档决策）：仅 v3 标签触发。
# Windows = 解压即用归档（bootstrap zip 双击解压 + 系统 Evergreen；offline
# tar.zst 内嵌 Fixed Version 运行时完全离线，zstd 压缩体积优化，用内置 tar
# 解压，无安装器）；Linux = 发行版无关 tar.zst（bootstrap
# 系统 WebKitGTK + offline 自含，AppImage 与 tar.zst 并存；不再产出 deb/rpm）
# ——两者与 --portable 与否无关；macOS 保持 dmg 双变体（不签名——签名/公证
# 在受控发行环境后补，P5-07）。汇总 job 是唯一写 release 的入口，校验产物
# 名集合与本次构建目标子集（verify 步骤的 --target 列表）完全相等后创建
# draft（不 overwrite，不自动发布）。
# 旧 v2.x 标签不再触发（D1：旧架构 2.6.0 为终点版本）。

on:
  push:
    tags:
      - "v3*"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # CI-04：按平台构建变体。产物命名/矩阵由 packaging/targets.json 派生。
  build-windows:
    name: build windows x64 (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # bootstrap=系统 Evergreen+bootstrapper sidecar；offline=内嵌 Fixed
        # Version 运行时（构建期抓官方下载页直链下载 cab，~300MB，缓存于
        # build/webview2-fixedruntime）。
        variant: [bootstrap, offline]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Ensure zstd (offline tar.zst uses zstd -19 -T0; runner image ships it in PATH)
        if: matrix.variant == 'offline'
        shell: pwsh
        run: |
          try { zstd --version } catch { choco install zstandard -y --no-progress; zstd --version }
      - run: corepack yarn install --immutable
      - run: corepack yarn package:windows --variant=${{ matrix.variant }}
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: artifacts-windows-x64-${{ matrix.variant }}
          # bootstrap=zip（双击解压）；offline=tar.zst（zstd 压缩，体积优化）。
          # 两组 glob 各匹配对应变体的单一产物，另一组匹配空——upload-artifact
          # 仅当合并集合为空才 error，故混合 glob 对两变体均成立。
          path: |
            build/dist/xresconv-gui-*-windows-x64-${{ matrix.variant }}.zip
            build/dist/xresconv-gui-*-windows-x64-${{ matrix.variant }}.zip.sha256
            build/dist/xresconv-gui-*-windows-x64-${{ matrix.variant }}.tar.zst
            build/dist/xresconv-gui-*-windows-x64-${{ matrix.variant }}.tar.zst.sha256

  build-linux:
    name: build linux ${{ matrix.distro }} x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最老支持基线（glibc 2.35 地板）单点构建；tar.zst/AppImage 均发行版无关
          - distro: ubuntu-22.04
            variant: all
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev zstd
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn package:linux --variant=${{ matrix.variant }} --distro=${{ matrix.distro }}
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: artifacts-linux-${{ matrix.distro }}-x86_64
          path: |
            build/dist/xresconv-gui-*-linux-x86_64-bootstrap.tar.zst*
            build/dist/xresconv-gui-*-linux-x86_64-offline.AppImage*
            build/dist/xresconv-gui-*-linux-x86_64-offline.tar.zst*

  build-macos:
    name: build macos ${{ matrix.arch }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [bootstrap, offline]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: corepack yarn install --immutable
      # D5：x64/arm64 分别原生构建（runner 架构须匹配；arm64 用 macos arm64 runner）
      - run: corepack yarn package:macos --variant=${{ matrix.variant }} --arch=${{ matrix.arch }}

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: artifacts-macos-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            build/dist/xresconv-gui-*-macos-${{ matrix.arch }}-${{ matrix.variant }}.dmg*

  # CI-06：汇总（唯一写 release 的 job）。核对产物集合与 buildMatrix 完全相等，
  # 再创建 draft；不覆盖既有发行。签名与安装验收（G5）完成后才可正式发布。
  aggregate-release:
    name: aggregate draft release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: corepack yarn install --immutable
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: build/release-artifacts
      - name: Verify artifact set equals expected matrix
        # --target 列表 = 本次 CI 实际构建的目标（targetKey 格式，见
        # packaging/src/matrix.ts selectMatrix）；必须与上方三个 build job 的
        # matrix 同步维护。剩余基线目标（windows/linux arm64）待原生/交叉
        # 构建通道落实后加入。未传 --target 时按全量矩阵校验（本地预检语义）。
        run: >
          node scripts/verify-release.ts
          --target=windows/-/x64/bootstrap --target=windows/-/x64/offline
          --target=macos/-/x64/bootstrap --target=macos/-/x64/offline
          --target=macos/-/arm64/bootstrap --target=macos/-/arm64/offline
          --target=linux/-/x86_64/bootstrap --target=linux/-/x86_64/offline
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Create draft release (no overwrite)
        # xresloader/upload-to-github-release v1.6.2
        uses: xresloader/upload-to-github-release@7c5757a90c0bcf0c0e1741da8f2abd7b85e675d0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "build/release-artifacts/**/*"
          tags: true
          draft: true
          # 含 prerelease 后缀的 tag（如 v3.0.0-dev.0、v3.0.0-rc.1）标记为
          # pre-release；正式版 tag（如 v3.0.0）保持 false。
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite: false
